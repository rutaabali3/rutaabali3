name: Validate Profile README

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate portfolio Tech Stack assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(angular anthropic aspnet bootstrap canva csharp css firebase gitlab gsap html javascript jquery laravel mysql netlify openai php phpmyadmin seo sqlserver tailwind typescript vercel)
          for name in "${expected[@]}"; do
            test -s "assets/tech/${name}.png"
          done
          test -s assets/neon-terminal.gif
          test "$(grep -o 'assets/tech/[^/]\+\.png' readme.md | sort -u | wc -l)" -eq "${#expected[@]}"
          ! grep -q 'assets/skills/' readme.md
          ! grep -q 'github-profile-summary-cards.vercel.app' readme.md
          ! grep -qE 'background(-color)?\s*:' readme.md
          grep -q '<!-- LIVE-GITHUB-TABLES:START -->' readme.md
          grep -q '<!-- LIVE-GITHUB-TABLES:END -->' readme.md
          grep -q '^## Commit activity output' readme.md
          grep -q '^## Contributor statistics output' readme.md
          grep -q '^## Language mix output' readme.md
          grep -q '^## Profile details output' readme.md
          ! grep -q 'Recent active date' readme.md
          ! grep -q 'Recent contribution activity' readme.md
          ! grep -qE '\.svg|github-contribution-grid-snake' readme.md
          echo "Validated ${#expected[@]} displayed Tech Stack PNGs, the terminal GIF, and four live Markdown statistics tables."

      - name: Check README formatting
        run: git diff --check
